<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FavorGame — ご近所お願い交換</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --line: #262d36;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #f97316;
    --good: #22c55e;
    --bad: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 24px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr; }
    .leaderboard { grid-column: span 2; }
  }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  section h2 { margin-top: 0; font-size: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
  input, select, textarea {
    width: 100%;
    background: #0b0e12;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  button {
    margin-top: 12px;
    background: var(--accent);
    color: #1a1a1a;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  pre.log {
    background: #0b0e12;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    max-height: 220px;
    overflow: auto;
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>FavorGame — 現実世界のお願い交換</h1>
  <p>席を譲ったらポイント、譲られたら減点。お金を払って席・荷物・トイレ順番のお願いを通知できます。</p>
</header>
<main>

<section>
  <h2>ユーザー登録</h2>
  <label>ユーザー名 (英数字)</label>
  <input id="reg-username" placeholder="alice" />
  <label>表示名</label>
  <input id="reg-display" placeholder="アリス" />
  <label>初期所持金 (円)</label>
  <input id="reg-yen" type="number" value="1000" />
  <button onclick="register()">登録</button>
</section>

<section>
  <h2>お金を払ってお願いする</h2>
  <label>依頼者</label>
  <input id="req-user" placeholder="alice" />
  <label>種類</label>
  <select id="req-kind">
    <option value="seat">席を譲ってほしい</option>
    <option value="luggage">荷物を持ってほしい</option>
    <option value="toilet">トイレ順番を譲ってほしい</option>
    <option value="child">子供を一時的に見てほしい</option>
    <option value="generic">その他 (description 必須)</option>
  </select>
  <label>金額 (円)</label>
  <input id="req-yen" type="number" value="100" />
  <label>説明</label>
  <input id="req-desc" placeholder="新幹線で作業したいので" />
  <button onclick="postRequest()">お願いを通知</button>
</section>

<section>
  <h2>自発的な親切を記録</h2>
  <label>譲った人</label>
  <input id="sp-giver" placeholder="alice" />
  <label>受けた人</label>
  <input id="sp-receiver" placeholder="bob" />
  <label>種類</label>
  <select id="sp-kind">
    <option value="seat">席を譲った</option>
    <option value="luggage">荷物を持った</option>
    <option value="toilet">トイレ順番を譲った</option>
    <option value="child">子供を見てあげた</option>
    <option value="generic">その他</option>
  </select>
  <label>メモ</label>
  <input id="sp-note" placeholder="JR山手線で" />
  <button onclick="postSpontaneous()">記録</button>
</section>

<section>
  <h2>通知ボックス</h2>
  <label>ユーザー名</label>
  <div class="row">
    <input id="inbox-user" placeholder="bob" />
    <button class="secondary" onclick="loadInbox()">更新</button>
  </div>
  <div id="inbox"></div>
</section>

<section class="leaderboard">
  <h2>リーダーボード <button class="secondary" onclick="loadAll()">全部更新</button></h2>
  <table>
    <thead><tr><th>#</th><th>表示名</th><th>username</th><th>points</th><th>wallet (円)</th></tr></thead>
    <tbody id="lb"></tbody>
  </table>
  <h2 style="margin-top:24px">公開中のお願い</h2>
  <table>
    <thead><tr><th>id</th><th>依頼者</th><th>種類</th><th>金額</th><th>状態</th><th>説明</th></tr></thead>
    <tbody id="req-list"></tbody>
  </table>
</section>

<section style="grid-column: 1 / -1">
  <h2>API レスポンス</h2>
  <p class="muted">/tmp に保存される JSON はサーバの cold start でリセットされるよ。永続化が欲しければ Vercel KV か Postgres に差し替える。</p>
  <pre class="log" id="log">ready.</pre>
</section>

</main>

<script>
async function api(method, path, body) {
  const opts = { method, headers: {"Content-Type": "application/json"} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  document.getElementById("log").textContent =
    `[${method} ${path} -> ${res.status}]\n` +
    (typeof data === "string" ? data : JSON.stringify(data, null, 2));
  if (!res.ok) throw new Error((data && data.error) || text);
  return data;
}

async function register() {
  await api("POST", "/api/users", {
    username: val("reg-username"),
    display_name: val("reg-display"),
    starting_yen: parseInt(val("reg-yen") || "0", 10),
  });
  loadAll();
}

async function postRequest() {
  await api("POST", "/api/requests", {
    requester: val("req-user"),
    kind: val("req-kind"),
    bounty_yen: parseInt(val("req-yen") || "0", 10),
    description: val("req-desc"),
  });
  loadAll();
}

async function postSpontaneous() {
  await api("POST", "/api/spontaneous", {
    giver: val("sp-giver"),
    receiver: val("sp-receiver"),
    kind: val("sp-kind"),
    note: val("sp-note"),
  });
  loadAll();
}

async function loadInbox() {
  const user = val("inbox-user");
  if (!user) return;
  const notes = await api("GET", "/api/inbox/" + encodeURIComponent(user));
  const target = document.getElementById("inbox");
  if (!notes.length) {
    target.innerHTML = "<p class='muted'>(空)</p>";
    return;
  }
  target.innerHTML = notes.map(n => `
    <div style="border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px">
      <div>通知 #${n.id} (request ${n.request_id})</div>
      <div class="row">
        <button onclick="acceptRequest(${n.request_id}, '${user}')">承認</button>
        <button class="secondary" onclick="ignoreNote(${n.id}, '${user}')">無視</button>
      </div>
    </div>
  `).join("");
}

async function acceptRequest(rid, user) {
  await api("POST", `/api/requests/${rid}/accept`, { accepter: user });
  loadAll();
}

async function ignoreNote(nid, user) {
  await api("POST", `/api/notifications/${nid}/ignore`, { username: user });
  loadAll();
}

async function loadAll() {
  const [board, reqs] = await Promise.all([
    api("GET", "/api/leaderboard"),
    api("GET", "/api/requests"),
  ]);
  document.getElementById("lb").innerHTML = board.map(e => `
    <tr>
      <td>${e.rank}</td>
      <td>${escapeHTML(e.display_name)}</td>
      <td><span class="pill">${escapeHTML(e.username)}</span></td>
      <td class="${e.points > 0 ? 'pos' : e.points < 0 ? 'neg' : ''}">${e.points}</td>
      <td>${e.wallet_yen}</td>
    </tr>
  `).join("");
  document.getElementById("req-list").innerHTML = reqs.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.requester_id}</td>
      <td>${escapeHTML(r.kind)}</td>
      <td>${r.bounty_yen}</td>
      <td><span class="pill">${escapeHTML(r.status)}</span></td>
      <td>${escapeHTML(r.description || "")}</td>
    </tr>
  `).join("");
  if (val("inbox-user")) loadInbox();
}

function val(id) { return document.getElementById(id).value.trim(); }
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

loadAll().catch(err => {
  document.getElementById("log").textContent = "API がまだ応答していません: " + err.message;
});
</script>
</body>
</html>
